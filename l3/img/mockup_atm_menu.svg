<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <!-- Chasis del Cajero en gris claro suave -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" />
  
  <!-- Encabezado del Cajero -->
  <rect x="50" y="40" width="700" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="70" y="72" fill="#1e293b" font-size="20" font-weight="bold">BANCO DE CRÉDITO &amp; RED UNIBANC</text>
  <text x="560" y="71" fill="#64748b" font-size="13">Cliente: LUIS SEQUEIROS</text>

  <!-- Pantalla Principal ATM: Menú de Operaciones -->
  <rect x="50" y="110" width="700" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

  <text x="260" y="145" fill="#0f172a" font-size="18" font-weight="bold">SELECCIONE UNA OPERACIÓN</text>
  <text x="245" y="168" fill="#64748b" font-size="13">Operaciones transaccionales bancarias disponibles</text>

  <!-- Botones de Operación Izquierda -->
  <!-- Op 1: Retiro -->
  <g>
    <rect x="80" y="190" width="280" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="100" y="222" fill="#0f172a" font-size="16" font-weight="bold">RETIRAR EFECTIVO</text>
    <text x="100" y="240" fill="#64748b" font-size="12">Dispensación inmediata en billetes</text>
  </g>

  <!-- Op 2: Depósito -->
  <g>
    <rect x="80" y="270" width="280" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="100" y="302" fill="#0f172a" font-size="16" font-weight="bold">DEPOSITAR EFECTIVO</text>
    <text x="100" y="320" fill="#64748b" font-size="12">Abono directo a cuenta o terceros</text>
  </g>

  <!-- Botones de Operación Derecha -->
  <!-- Op 3: Transferencias -->
  <g>
    <rect x="440" y="190" width="280" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="460" y="222" fill="#0f172a" font-size="16" font-weight="bold">TRANSFERENCIAS</text>
    <text x="460" y="240" fill="#64748b" font-size="12">Entre cuentas propias e interbancarias</text>
  </g>

  <!-- Op 4: Consulta de Información -->
  <g>
    <rect x="440" y="270" width="280" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="460" y="302" fill="#0f172a" font-size="16" font-weight="bold">CONSULTA DE CUENTA</text>
    <text x="460" y="320" fill="#64748b" font-size="12">Saldos, últimos movimientos y extracto</text>
  </g>

  <!-- Botón Salir / Cancelar -->
  <rect x="290" y="375" width="220" height="45" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="345" y="403" fill="#1e293b" font-size="15" font-weight="bold">FINALIZAR SESIÓN</text>
</svg>
