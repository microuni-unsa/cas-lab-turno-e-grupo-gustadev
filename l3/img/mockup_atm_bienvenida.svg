<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <!-- Chasis del Cajero en gris claro suave -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" />
  
  <!-- Encabezado del Cajero -->
  <rect x="50" y="40" width="700" height="50" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="70" y="72" fill="#1e293b" font-size="20" font-weight="bold" letter-spacing="1">BANCO DE CRÉDITO &amp; CONSORCIO RED UNIBANC</text>
  <circle cx="710" cy="65" r="7" fill="#94a3b8" />
  <text x="640" y="70" fill="#64748b" font-size="12" font-weight="600">EN LÍNEA</text>

  <!-- Pantalla Principal ATM -->
  <rect x="50" y="110" width="450" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Contenido Pantalla ATM: Autenticación -->
  <rect x="70" y="130" width="410" height="35" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <text x="150" y="154" fill="#0f172a" font-size="15" font-weight="bold">AUTENTICACIÓN DE CLIENTE</text>

  <text x="80" y="205" fill="#1e293b" font-size="15" font-weight="600">Inserte su tarjeta y digite su PIN:</text>
  
  <!-- Campo Tarjeta -->
  <text x="80" y="240" fill="#64748b" font-size="13">Tarjeta Detectada:</text>
  <rect x="80" y="250" width="350" height="35" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="100" y="273" fill="#0f172a" font-size="15" font-family="monospace">**** - **** - **** - 4590  [VISA DEBIT]</text>

  <!-- Campo PIN -->
  <text x="80" y="315" fill="#64748b" font-size="13">Clave Secreta (4 dígitos):</text>
  <rect x="80" y="325" width="200" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <text x="105" y="352" fill="#1e293b" font-size="26" font-weight="bold" letter-spacing="8">● ● ● ●</text>

  <!-- Mensaje de Seguridad -->
  <rect x="80" y="385" width="390" height="45" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="95" y="405" fill="#334155" font-size="12" font-weight="bold">AVISO DE SEGURIDAD:</text>
  <text x="95" y="420" fill="#64748b" font-size="11">Cubra el teclado con su mano. Bloqueo automático al 3er fallo.</text>

  <!-- Periféricos Físicos (Lado Derecho) -->
  <!-- Ranura de Tarjeta -->
  <rect x="530" y="110" width="220" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="545" y="135" fill="#64748b" font-size="12" font-weight="bold">RANURA DE TARJETA</text>
  <rect x="550" y="150" width="180" height="12" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  <polygon points="635,170 645,170 640,178" fill="#94a3b8" />

  <!-- Dispensador de Billetes -->
  <rect x="530" y="210" width="220" height="95" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="545" y="235" fill="#64748b" font-size="12" font-weight="bold">DISPENSADOR DE EFECTIVO</text>
  <rect x="550" y="250" width="180" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="575" y="285" fill="#94a3b8" font-size="11">Espere la apertura de bandeja</text>

  <!-- Teclado Numérico Físico (Keypad) -->
  <rect x="530" y="320" width="220" height="130" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="545" y="340" fill="#64748b" font-size="11" font-weight="bold">TECLADO CRIPTOGRÁFICO (EPP)</text>
  
  <!-- Teclas en escala de grises suave -->
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1">
    <rect x="545" y="350" width="30" height="20" rx="3"/><text x="556" y="365" fill="#1e293b" font-size="11">1</text>
    <rect x="585" y="350" width="30" height="20" rx="3"/><text x="596" y="365" fill="#1e293b" font-size="11">2</text>
    <rect x="625" y="350" width="30" height="20" rx="3"/><text x="636" y="365" fill="#1e293b" font-size="11">3</text>
    <rect x="670" y="350" width="60" height="20" rx="3" fill="#e2e8f0"/><text x="679" y="365" fill="#334155" font-size="10" font-weight="bold">CANCEL</text>

    <rect x="545" y="375" width="30" height="20" rx="3"/><text x="556" y="390" fill="#1e293b" font-size="11">4</text>
    <rect x="585" y="375" width="30" height="20" rx="3"/><text x="596" y="390" fill="#1e293b" font-size="11">5</text>
    <rect x="625" y="375" width="30" height="20" rx="3"/><text x="636" y="390" fill="#1e293b" font-size="11">6</text>
    <rect x="670" y="375" width="60" height="20" rx="3" fill="#e2e8f0"/><text x="682" y="390" fill="#334155" font-size="10" font-weight="bold">BORRAR</text>

    <rect x="545" y="400" width="30" height="20" rx="3"/><text x="556" y="415" fill="#1e293b" font-size="11">7</text>
    <rect x="585" y="400" width="30" height="20" rx="3"/><text x="596" y="415" fill="#1e293b" font-size="11">8</text>
    <rect x="625" y="400" width="30" height="20" rx="3"/><text x="636" y="415" fill="#1e293b" font-size="11">9</text>
    <rect x="670" y="400" width="60" height="20" rx="3" fill="#cbd5e1"/><text x="681" y="415" fill="#0f172a" font-size="10" font-weight="bold">ENTRAR</text>

    <rect x="585" y="425" width="30" height="20" rx="3"/><text x="596" y="440" fill="#1e293b" font-size="11">0</text>
  </g>
</svg>
