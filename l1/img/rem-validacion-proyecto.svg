<svg xmlns="http://www.w3.org/2000/svg" width="850" height="460" viewBox="0 0 850 460">
  <defs>
    <filter id="win-shadow" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="850" height="460" fill="#f1f3f5" rx="6"/>

  <!-- Window Container -->
  <g transform="translate(35, 20)" filter="url(#win-shadow)">
    <!-- Title bar -->
    <rect width="780" height="32" rx="4" fill="#1864ab"/>
    <text x="15" y="21" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="bold">REM (REMUS) - Asistente de Verificación y Validación de Requisitos</text>
    <rect x="745" y="6" width="20" height="20" rx="3" fill="#e03131"/>
    <text x="755" y="20" font-family="sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">✕</text>

    <!-- Window Body -->
    <rect y="32" width="780" height="388" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>

    <!-- Verification Header Status Banner -->
    <rect x="20" y="48" width="740" height="55" rx="4" fill="#ebfbee" stroke="#40c057" stroke-width="1.5"/>
    <circle cx="50" cy="75" r="16" fill="#2b8a3e"/>
    <path d="M42 75 L48 81 L59 69" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="69" font-family="sans-serif" font-size="14" fill="#2b8a3e" font-weight="bold">Verificación Formal Exitosa: 0 Errores, 0 Advertencias</text>
    <text x="78" y="88" font-family="sans-serif" font-size="11" fill="#495057">El proyecto 'lab1_requerimientos.rem' cumple estrictamente el esquema DTD remus.dtd y la norma IEEE Std 830-1998.</text>

    <!-- Tabs Header -->
    <g transform="translate(20, 115)">
      <rect width="180" height="26" fill="#ffffff" stroke="#ced4da" stroke-width="1" rx="3"/>
      <line x1="0" y1="26" x2="180" y2="26" stroke="#ffffff" stroke-width="2"/>
      <text x="90" y="17" font-family="sans-serif" font-size="11" fill="#1864ab" font-weight="bold" text-anchor="middle">Reglas de Consistencia (12/12)</text>

      <rect x="185" y="0" width="160" height="26" fill="#f8f9fa" stroke="#dee2e6" rx="3"/>
      <text x="265" y="17" font-family="sans-serif" font-size="11" fill="#868e96" text-anchor="middle">Estadísticas del Modelo</text>
    </g>

    <!-- Verification Rules Table -->
    <rect x="20" y="141" width="740" height="215" fill="#ffffff" stroke="#dee2e6"/>
    
    <!-- Table Header -->
    <rect x="20" y="141" width="740" height="25" fill="#e9ecef"/>
    <text x="35" y="157" font-family="sans-serif" font-size="10" fill="#495057" font-weight="bold">Estado</text>
    <text x="95" y="157" font-family="sans-serif" font-size="10" fill="#495057" font-weight="bold">Regla de Validación / Consistencia</text>
    <text x="490" y="157" font-family="sans-serif" font-size="10" fill="#495057" font-weight="bold">Alcance Evaluado</text>
    <text x="660" y="157" font-family="sans-serif" font-size="10" fill="#495057" font-weight="bold">Resultado</text>

    <!-- Row 1 -->
    <rect x="20" y="166" width="740" height="26" fill="#f8f9fa"/>
    <circle cx="48" cy="179" r="6" fill="#40c057"/>
    <text x="95" y="183" font-family="sans-serif" font-size="10" fill="#212529">VR-01: Identificadores unívocos en todas las entidades</text>
    <text x="490" y="183" font-family="sans-serif" font-size="10" fill="#495057">Todos los SpecObjects</text>
    <text x="660" y="183" font-family="sans-serif" font-size="10" fill="#2b8a3e" font-weight="bold">CONFORME</text>

    <!-- Row 2 -->
    <rect x="20" y="192" width="740" height="26" fill="#ffffff"/>
    <circle cx="48" cy="205" r="6" fill="#40c057"/>
    <text x="95" y="209" font-family="sans-serif" font-size="10" fill="#212529">VR-02: Completitud de atributos obligatorios (importancia, estabilidad, estado)</text>
    <text x="490" y="209" font-family="sans-serif" font-size="10" fill="#495057">RF, RNF, OBJ, CU, RI</text>
    <text x="660" y="209" font-family="sans-serif" font-size="10" fill="#2b8a3e" font-weight="bold">CONFORME</text>

    <!-- Row 3 -->
    <rect x="20" y="218" width="740" height="26" fill="#f8f9fa"/>
    <circle cx="48" cy="231" r="6" fill="#40c057"/>
    <text x="95" y="235" font-family="sans-serif" font-size="10" fill="#212529">VR-03: Ausencia de requisitos funcionales huérfanos (trazabilidad a OBJ)</text>
    <text x="490" y="235" font-family="sans-serif" font-size="10" fill="#495057">6 Requisitos Funcionales</text>
    <text x="660" y="235" font-family="sans-serif" font-size="10" fill="#2b8a3e" font-weight="bold">CONFORME</text>

    <!-- Row 4 -->
    <rect x="20" y="244" width="740" height="26" fill="#ffffff"/>
    <circle cx="48" cy="257" r="6" fill="#40c057"/>
    <text x="95" y="261" font-family="sans-serif" font-size="10" fill="#212529">VR-04: Asignación de actores a casos de uso (pre/postcondición)</text>
    <text x="490" y="261" font-family="sans-serif" font-size="10" fill="#495057">3 Casos de Uso</text>
    <text x="660" y="261" font-family="sans-serif" font-size="10" fill="#2b8a3e" font-weight="bold">CONFORME</text>

    <!-- Row 5 -->
    <rect x="20" y="270" width="740" height="26" fill="#f8f9fa"/>
    <circle cx="48" cy="283" r="6" fill="#40c057"/>
    <text x="95" y="287" font-family="sans-serif" font-size="10" fill="#212529">VR-05: Integridad del Documento de Especificación ERS (C_Requirements)</text>
    <text x="490" y="287" font-family="sans-serif" font-size="10" fill="#495057">1 Documento ERS</text>
    <text x="660" y="287" font-family="sans-serif" font-size="10" fill="#2b8a3e" font-weight="bold">CONFORME</text>

    <!-- Row 6 -->
    <rect x="20" y="296" width="740" height="26" fill="#ffffff"/>
    <circle cx="48" cy="309" r="6" fill="#40c057"/>
    <text x="95" y="313" font-family="sans-serif" font-size="10" fill="#212529">VR-06: Conformidad con DTD remus.dtd para exportación XML/XSLT</text>
    <text x="490" y="313" font-family="sans-serif" font-size="10" fill="#495057">Esquema XML Global</text>
    <text x="660" y="313" font-family="sans-serif" font-size="10" fill="#2b8a3e" font-weight="bold">CONFORME</text>

    <!-- Row 7 -->
    <rect x="20" y="322" width="740" height="34" fill="#f8f9fa"/>
    <circle cx="48" cy="338" r="6" fill="#40c057"/>
    <text x="95" y="342" font-family="sans-serif" font-size="10" fill="#212529">VR-07: Inexistencia de conflictos o defectos bloqueantes pendientes</text>
    <text x="490" y="342" font-family="sans-serif" font-size="10" fill="#495057">Módulo de Defectos</text>
    <text x="660" y="342" font-family="sans-serif" font-size="10" fill="#2b8a3e" font-weight="bold">CONFORME</text>

    <!-- Dialog Action Buttons -->
    <rect x="490" y="372" width="130" height="30" rx="4" fill="#ffffff" stroke="#ced4da"/>
    <text x="555" y="391" font-family="sans-serif" font-size="11" fill="#495057" font-weight="bold" text-anchor="middle">Exportar Informe</text>

    <rect x="635" y="372" width="125" height="30" rx="4" fill="#1864ab"/>
    <text x="697" y="391" font-family="sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">Cerrar</text>
  </g>
</svg>
